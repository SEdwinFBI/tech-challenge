<text x="664" y="432" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#17231f">Devuelto parcial</text>
<text x="664" y="453" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">Se devolvieron algunas líneas</text>
</g>
<g>
