<text x="219" y="432" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#17231f">Cancelado</text>
<text x="219" y="453" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">Las unidades vuelven a la bodega</text>
<text x="219" y="494" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b3402a" letter-spacing="0.5">ESTADO FINAL</text>
</g>
<g>
