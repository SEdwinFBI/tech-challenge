<rect width="100%" height="100%" fill="#f7f8f6"/>
<text x="70" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#17231f">Estados del pedido</text>
<text x="70" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5b6b65">Tabla: TransicionesEstadoPedido</text>
