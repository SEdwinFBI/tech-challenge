<text x="844" y="223" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">El cliente lo recibió</text>
</g>
<g>
<rect x="195" y="400" width="190" height="76" rx="14" fill="#ffffff" stroke="#b3402a" stroke-width="2"/>
