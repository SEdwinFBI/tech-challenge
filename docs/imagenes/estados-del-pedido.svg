<text x="594" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#17231f">Despachado</text>
<text x="594" y="223" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">Salió con mensajería</text>
