<text x="1060" y="314" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#44544e" font-weight="600" paint-order="stroke" stroke="#f7f8f6" stroke-width="4">todo el pedido</text>
