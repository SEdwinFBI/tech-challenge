<rect x="70" y="500" width="350" height="76" rx="10" fill="#ffffff" stroke="#dde3df"/>
<text x="84" y="523" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#17231f">Quién avanza el pedido</text>
<text x="84" y="542" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">El operador y el administrador preparan, despachan</text>
<text x="84" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">y entregan. El cliente consulta su historial.</text>
<rect x="442" y="500" width="350" height="76" rx="10" fill="#ffffff" stroke="#dde3df"/>
<text x="456" y="523" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#17231f">Cancelación</text>
<text x="456" y="542" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">Solo antes del despacho: desde Pagado o En</text>
<text x="456" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">preparación. Las unidades vuelven al kardex.</text>
<rect x="814" y="500" width="350" height="76" rx="10" fill="#ffffff" stroke="#dde3df"/>
<text x="828" y="523" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#17231f">Devoluciones</text>
<text x="828" y="542" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">Solo en pedidos entregados y por líneas. Cada una</text>
<text x="828" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6b65">repone existencias y reembolsa su monto.</text>
