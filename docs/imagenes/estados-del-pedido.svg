<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="600" viewBox="0 0 1220 600" role="img" aria-labelledby="t2 d2">
<title id="t2">Estados del pedido en ShopCart</title><desc id="d2">Un pedido nace pagado y avanza a en preparación, despachado y entregado. Puede cancelarse antes del despacho y devolverse después de la entrega.</desc>
