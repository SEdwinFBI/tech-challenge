x-api: &api
  build: ./shop-cart-backend
  profiles: ["app"]
  restart: unless-stopped
  env_file:
    - ./shop-cart-backend/.env
  depends_on:
    db-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  networks:
    - shopcart-network

x-api-env: &api-env
  DB_HOST: mssql-server
  DB_PORT: "1433"
  REDIS_URL: redis://redis:6379
  TRUST_PROXY: "1"
  CORS_ALLOW_ORIGIN: http://localhost:8080

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql-server
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:? MSSQL_SA_PASSWORD en el archivo .env}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopcart-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    profiles: ["app"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shopcart-network

  db-init:
    build:
      context: ./shop-cart-backend
      target: setup
    profiles: ["app"]
    restart: "no"
    env_file:
      - ./shop-cart-backend/.env
    environment:
      DB_HOST: mssql-server
      DB_PORT: "1433"
    depends_on:
      mssql-server:
        condition: service_healthy
    networks:
      - shopcart-network

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  web:
    build: ./shop-cart-ui
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      - shopcart-network

  prometheus:
    image: prom/prometheus
    profiles: ["app"]
    restart: unless-stopped
    volumes:
      - ./infra/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    networks:
      - shopcart-network

  grafana:
    image: grafana/grafana
    profiles: ["app"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - shopcart-network

volumes:
  mssql_data:
    driver: local
networks:
  shopcart-network:
    driver: bridge