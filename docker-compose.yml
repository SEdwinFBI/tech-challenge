
#CONFIGURACIONES
x-api: &api
  restart: unless-stopped
  networks:
    - shopcart-network

x-api-env: &api-env
  REDIS_URL: redis://redis:6379
  TRUST_PROXY: "1"
  CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:-http://localhost:8080}"

x-web: &web
  environment:
    NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
  restart: unless-stopped
  volumes:
    - ./shop-cart-infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro,z
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - shopcart-network

x-db-init: &db-init
  restart: "no"
  networks:
    - shopcart-network

services:


  # INFRAESTRUCTURA
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: ["app"]
    container_name: mssql-server
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD en .env}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopcart-network

  redis:
    image: redis:7-alpine
    profiles: ["app", "prod"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shopcart-network

  # DEV - PROFILE APP
  db-init:
    <<: *db-init
    profiles: ["app"]
    build:
      context: ./shop-cart-backend
      target: setup
    env_file:
      - ./.env
    environment:
      DB_HOST: mssql-server
      DB_PORT: "1433"
      DB_ENCRYPT: "false"
    depends_on:
      mssql-server:
        condition: service_healthy

  api-1:
    <<: *api
    profiles: ["app"]
    build:
      context: ./shop-cart-backend
      target: api
    env_file:
      - ./.env
    environment:
      <<: *api-env
      DB_HOST: mssql-server
      DB_PORT: "1433"
      DB_ENCRYPT: "false"
      INSTANCE_ID: api-1
      CORS_ALLOW_ORIGIN: "http://localhost:${WEB_PORT:-8080}"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api-2:
    <<: *api
    profiles: ["app"]
    build:
      context: ./shop-cart-backend
      target: api
    env_file:
      - ./.env
    environment:
      <<: *api-env
      DB_HOST: mssql-server
      DB_PORT: "1433"
      DB_ENCRYPT: "false"
      INSTANCE_ID: api-2
      CORS_ALLOW_ORIGIN: "http://localhost:${WEB_PORT:-8080}"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *web
    profiles: ["app"]
    build:
      context: ./shop-cart-ui
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started


  # PRODUCCION - PROFILE PROD
  db-init-prod:
    <<: *db-init
    profiles: ["prod"]
    image: ${DB_INIT_IMAGE:-edwinbaquiax/shop-cart-setup:latest}
    pull_policy: always
    env_file:
      - ./.env

  api-1-prod:
    <<: *api
    profiles: ["prod"]
    image: ${API_IMAGE:-edwinbaquiax/shop-cart-api:latest}
    pull_policy: always
    env_file:
      - ./.env
    environment:
      <<: *api-env
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      INSTANCE_ID: api-1
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN en .env (https://shop-cart.code-qx.click)}"
    depends_on:
      db-init-prod:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      shopcart-network:
        aliases:
          - api-1

  api-2-prod:
    <<: *api
    profiles: ["prod"]
    image: ${API_IMAGE:-edwinbaquiax/shop-cart-api:latest}
    pull_policy: always
    env_file:
      - ./.env
    environment:
      <<: *api-env
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      INSTANCE_ID: api-2
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN en .env (https://shop-cart.code-qx.click)}"
    depends_on:
      db-init-prod:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      shopcart-network:
        aliases:
          - api-2

  web-prod:
    <<: *web
    profiles: ["prod"]
    image: ${WEB_IMAGE:-edwinbaquiax/shop-cart-web:latest}
    pull_policy: always
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api-1-prod:
        condition: service_started
      api-2-prod:
        condition: service_started
    networks:
      shopcart-network:
        aliases:
          - web


  # OBSERVABILIDAD
  prometheus:
    image: prom/prometheus
    profiles: ["app", "prod"]
    restart: unless-stopped
    volumes:
      - ./shop-cart-infra/prometheus:/etc/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - shopcart-network

  grafana:
    image: grafana/grafana
    profiles: ["app", "prod"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3002/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "${GRAFANA_SERVE_FROM_SUB_PATH:-false}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD en .env}"
    volumes:
      - ./shop-cart-infra/grafana/provisioning:/etc/grafana/provisioning
      - ./shop-cart-infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    networks:
      - shopcart-network

volumes:
  mssql_data:
    driver: local

networks:
  shopcart-network:
    driver: bridge
